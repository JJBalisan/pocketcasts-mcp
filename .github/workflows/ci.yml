# Runs the hermetic client-layer test suite. Lint is not gated here yet: the
# existing sources predate the shared Google-style ruff config (audit P2).
name: ci
on: [push, pull_request]
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: CI (the same script runs locally)
        run: bash tests/ci.sh
