# Runs the hermetic client-layer test suite. Lint is not gated here yet: the
# existing sources predate the shared Google-style ruff config (audit P2).
name: ci
# A PR runs once, on its pull_request event; push runs only on main (the
# merge), so a PR branch push and a release tag no longer run CI again on
# a commit that already passed (dev-toolchain#7).
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A newer push to a PR cancels its older run, which would otherwise queue
# on the repo's one self-hosted runner; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      # setup-uv v10.3.0, pinned by commit: setup-uv publishes no moving
      # major tag, so `@v10` (or the old `@v6`) does not resolve.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          # Off on the self-hosted runner: there setup-uv's cache is JJ's
          # whole ~/.cache/uv (3 GB), which it uploaded after every job and
          # restored over the live cache. The local cache persists anyway.
          enable-cache: ${{ !vars.CI_RUNNER }}
      - name: CI (the same script runs locally)
        run: bash tests/ci.sh
